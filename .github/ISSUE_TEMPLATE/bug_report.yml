name: Behavior or packaging bug
description: Report incorrect skill behavior, packaging, or validation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include real personal data, credentials, identity documents, or production logs.
  - type: input
    id: version
    attributes:
      label: Version
      description: Plugin release or Git commit tested.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Sanitized request
      description: Provide the smallest synthetic prompt or repository context that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: regime
    attributes:
      label: Legal operating regime
      options:
        - Not applicable
        - CURRENT_LAW_THROUGH_2026_11_30
        - TRANSITION_PREPARATION_FOR_2026_REFORM
        - AMENDED_LAW_FROM_2026_12_01
    validations:
      required: true
